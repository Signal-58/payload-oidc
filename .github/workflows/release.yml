name: Release

# A `v*` tag (for example v0.2.0) runs CI, then publishes that commit to npm through npm trusted
# publishing, with provenance. No npm token is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version." >&2
            exit 1
          fi
      - run: pnpm build
      - run: node scripts/check-dist.mjs
      - run: pnpm check:package
      # npm, not pnpm: npm is the reference client for trusted publishing (11.5.1 or later; Node
      # 24 ships with it). The build above is what gets published, so scripts don't run again.
      # A version already on npm (published by hand, say) is left alone, so its tag still passes.
      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --ignore-scripts --tag "$tag"
